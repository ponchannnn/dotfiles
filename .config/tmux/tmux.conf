#マウス操作を有効にする
set-option -g mouse on

# スクロールでコピーモード内を2行ずつスクロール (デフォルトは5行)
# ogadra/dotfilesを踏襲
bind -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 2 scroll-down

set-option -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

# トゥルーカラー(24bit色)を有効化。ogadra/dotfilesを踏襲
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Claude Codeは$TMUXがあると色深度を256色に落とす仕様があるため、明示的にtruecolorを維持
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# ウィンドウ・ペインの番号を1始まりにする。ogadra/dotfilesを踏襲(デフォルトは0始まり)
set -g base-index 1
set -g pane-base-index 1

# escape-timeを0に(Vim/Emacs系キーバインドでEscの反応が遅れないように)。ogadra/dotfilesを踏襲
set -g escape-time 0

# コピーモードのキー操作をEmacs風に。ogadra/dotfilesを踏襲、自分がEmacs風キーバインド派なのに合う
set -g mode-keys emacs

# スクロールバックの保持行数。ogadra/dotfilesを踏襲
set -g history-limit 50000

# ステータスラインの色を変更
setw -g status-style fg=colour255,bg=colour234

# prefixで色変更
setw -g window-status-current-format '#[bg=colour2,fg=colour255]#{?client_prefix,#[bg=colour3],} #I #W '

# prefix経由のキー割り当て(wezterm側のショートカットの受け口も兼ねる)。ogadra/dotfilesを踏襲
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind w kill-window
bind n next-window
bind p previous-window
